name: Windows 10 RDP with Tailscale

on: 
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: windows-2022 # Provides a Windows Server environment (Win 10/11 equivalent)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        shell: powershell
        run: |
          Write-Host "Reclaiming disk space..."
          # Remove Android SDK (~12GB)
          Remove-Item -Recurse -Force $env:ANDROID_HOME -ErrorAction SilentlyContinue
          # Remove .NET Runtimes/SDKs (~2GB)
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          # Remove Strawberry Perl (~1GB)
          Remove-Item -Recurse -Force "C:\Strawberry" -ErrorAction SilentlyContinue
          Write-Host "Cleanup complete. Current free space:"
          Get-PSDrive C | Select-Object @{Name="Free(GB)";Expression={[math]::round($_.Free/1GB,2)}}

      - name: Setup Tailscale
        shell: powershell
        run: |
          # Replace 'tskey-auth-XXXX' with your actual Tailscale Auth Key
          $authKey = "tskey-auth-kS5WfEy4LX11CNTRL-WoqAbwAYsgCreWtLieGogCxLYitwhmoWH"
          
          # Install Tailscale
          Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile tailscale-setup.exe
          Start-Process -FilePath .\tailscale-setup.exe -ArgumentList "/quiet" -Wait
          
          # Start Tailscale and Login
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey $authKey --hostname "github-rdp-runner"
          Write-Host "Tailscale is connected!"

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Create RDP User
        shell: powershell
        run: |
          $user = "RDPUser"
          $password = ConvertTo-SecureString "StrongPass123!" -AsPlainText -Force
          New-LocalUser -Name $user -Password $password -Description "RDP Access User"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user
          Add-LocalGroupMember -Group "Administrators" -Member $user

      - name: Keep Alive (6 Hours)
        shell: powershell
        run: |
          Write-Host "RDP is ready! Connect to 'github-rdp-runner' using your RDP client."
          Write-Host "Username: RDPUser"
          Write-Host "Password: StrongPass123!"
          # Sleeps for 6 hours (the max limit for most free runners)
          Start-Sleep -Seconds 21600
